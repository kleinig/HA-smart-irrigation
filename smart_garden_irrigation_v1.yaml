variables:
  start_mode_input: !input start_mode
  log_actions_input: !input log_actions
  minimum_interval_input: !input minimum_interval

  rain_entity: !input rain_forecast
  rain_none_below_input: !input rain_none_below
  rain_low_below_input: !input rain_low_below
  rain_medium_below_input: !input rain_medium_below
  rain_high_below_input: !input rain_high_below
  rain_low_reduction_input: !input rain_low_reduction
  rain_medium_reduction_input: !input rain_medium_reduction
  rain_high_reduction_input: !input rain_high_reduction
  critical_rain_reduction_input: !input critical_rain_reduction

  temp_very_cool_input: !input temp_very_cool
  temp_cool_input: !input temp_cool
  temp_warm_input: !input temp_warm
  temp_hot_input: !input temp_hot
  temp_extreme_input: !input temp_extreme
  temp_very_cool_adjustment_input: !input temp_very_cool_adjustment
  temp_cool_adjustment_input: !input temp_cool_adjustment
  temp_warm_adjustment_input: !input temp_warm_adjustment
  temp_hot_adjustment_input: !input temp_hot_adjustment
  temp_extreme_adjustment_input: !input temp_extreme_adjustment
  humidity_high_input: !input humidity_high
  humidity_low_input: !input humidity_low
  humidity_high_adjustment_input: !input humidity_high_adjustment
  humidity_low_adjustment_input: !input humidity_low_adjustment
  summer_multiplier_input: !input summer_multiplier
  autumn_multiplier_input: !input autumn_multiplier
  winter_multiplier_input: !input winter_multiplier
  spring_multiplier_input: !input spring_multiplier

  configured_pump: !input pump
  pump_delay_input: !input pump_delay
  configured_tank: !input tank_level
  minimum_tank_level_input: !input minimum_tank_level
  water_rate_input: !input water_rate

  zones:
    - id: "Zone 1"
      enabled: !input zone_1_enabled
      valve: !input zone_1_valve
      moisture: !input zone_1_moisture
      temperature: !input zone_1_temperature
      humidity: !input zone_1_humidity
      target: !input zone_1_target
      threshold: !input zone_1_threshold
      critical: !input zone_1_critical
      min_duration: !input zone_1_min_duration
      max_duration: !input zone_1_max_duration
      minutes_per_percent: !input zone_1_minutes_per_percent
      cycle_enabled: !input zone_1_cycle_enabled
      cycle_duration: !input zone_1_cycle_duration
      soak_duration: !input zone_1_soak_duration

    - id: "Zone 2"
      enabled: !input zone_2_enabled
      valve: !input zone_2_valve
      moisture: !input zone_2_moisture
      temperature: !input zone_2_temperature
      humidity: !input zone_2_humidity
      target: !input zone_2_target
      threshold: !input zone_2_threshold
      critical: !input zone_2_critical
      min_duration: !input zone_2_min_duration
      max_duration: !input zone_2_max_duration
      minutes_per_percent: !input zone_2_minutes_per_percent
      cycle_enabled: !input zone_2_cycle_enabled
      cycle_duration: !input zone_2_cycle_duration
      soak_duration: !input zone_2_soak_duration

    - id: "Zone 3"
      enabled: !input zone_3_enabled
      valve: !input zone_3_valve
      moisture: !input zone_3_moisture
      temperature: !input zone_3_temperature
      humidity: !input zone_3_humidity
      target: !input zone_3_target
      threshold: !input zone_3_threshold
      critical: !input zone_3_critical
      min_duration: !input zone_3_min_duration
      max_duration: !input zone_3_max_duration
      minutes_per_percent: !input zone_3_minutes_per_percent
      cycle_enabled: !input zone_3_cycle_enabled
      cycle_duration: !input zone_3_cycle_duration
      soak_duration: !input zone_3_soak_duration

    - id: "Zone 4"
      enabled: !input zone_4_enabled
      valve: !input zone_4_valve
      moisture: !input zone_4_moisture
      temperature: !input zone_4_temperature
      humidity: !input zone_4_humidity
      target: !input zone_4_target
      threshold: !input zone_4_threshold
      critical: !input zone_4_critical
      min_duration: !input zone_4_min_duration
      max_duration: !input zone_4_max_duration
      minutes_per_percent: !input zone_4_minutes_per_percent
      cycle_enabled: !input zone_4_cycle_enabled
      cycle_duration: !input zone_4_cycle_duration
      soak_duration: !input zone_4_soak_duration

triggers:
  - trigger: time
    at: !input fixed_start
    id: fixed

  - trigger: sun
    event: sunrise
    offset: !input sun_offset
    id: sunrise

  - trigger: sun
    event: sunset
    offset: !input sun_offset
    id: sunset

  - trigger: time
    at: "02:00:00"
    id: night

conditions:
  - condition: template
    value_template: "{{ trigger.id == start_mode_input }}"

  - condition: template
    value_template: >
      {% if minimum_interval_input | float(0) == 0 %}
        true
      {% elif this.attributes.last_triggered is none %}
        true
      {% else %}
        {{ (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered))
           >= minimum_interval_input | float(0) * 3600 }}
      {% endif %}

actions:
  - if:
      - condition: template
        value_template: >
          {{ configured_tank is not none and
             states(configured_tank) not in ['unknown', 'unavailable', 'none'] and
             states(configured_tank) | float(0) < minimum_tank_level_input | float(0) }}
    then:
      - if:
          - condition: template
            value_template: "{{ log_actions_input }}"
        then:
          - action: persistent_notification.create
            data:
              title: "Irrigation blocked"
              message: >
                Tank level is {{ states(configured_tank) }} and the minimum allowed level is
                {{ minimum_tank_level_input }}.
      - stop: "Tank level too low."

  - if:
      - condition: template
        value_template: "{{ configured_pump is not none }}"
    then:
      - action: homeassistant.turn_on
        target:
          entity_id: !input pump
      - delay:
          seconds: !input pump_delay

  - repeat:
      for_each: "{{ zones }}"
      sequence:
        - variables:
            zone: "{{ repeat.item }}"

        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ not zone.enabled }}"
              sequence: []

            - conditions:
                - condition: template
                  value_template: >
                    {{ zone.valve is none or zone.moisture is none }}
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ log_actions_input }}"
                  then:
                    - action: persistent_notification.create
                      data:
                        title: "{{ zone.id }} skipped"
                        message: "Zone is enabled but its valve or soil-moisture sensor is not configured."

            - conditions:
                - condition: template
                  value_template: >
                    {{ states(zone.moisture) in ['unknown', 'unavailable', 'none'] }}
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ log_actions_input }}"
                  then:
                    - action: persistent_notification.create
                      data:
                        title: "{{ zone.id }} skipped"
                        message: "Soil-moisture sensor is unavailable."

            - conditions:
                - condition: template
                  value_template: >
                    {{ states(zone.moisture) | float(0) > zone.threshold | float(0) }}
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ log_actions_input }}"
                  then:
                    - action: persistent_notification.create
                      data:
                        title: "{{ zone.id }} skipped"
                        message: >
                          Soil moisture is {{ states(zone.moisture) | float(0) | round(1) }}%,
                          above the watering threshold of {{ zone.threshold | round(1) }}%.

            - conditions: []
              sequence:
                - variables:
                    soil: "{{ states(zone.moisture) | float(0) }}"
                    target: "{{ zone.target | float(0) }}"
                    deficit: >
                      {{ [zone.target | float(0) - states(zone.moisture) | float(0), 0] | max }}

                    rain: >
                      {% if rain_entity is not none and
                            states(rain_entity) not in ['unknown', 'unavailable', 'none'] %}
                        {{ states(rain_entity) | float(0) }}
                      {% else %}
                        0
                      {% endif %}

                    base_duration: >
                      {{ [zone.min_duration | float(0),
                          [zone.max_duration | float(0),
                           zone.min_duration | float(0) +
                           ([zone.target | float(0) - states(zone.moisture) | float(0), 0] | max) *
                           zone.minutes_per_percent | float(0)] | min] | max }}

                    temperature_value: >
                      {% if zone.temperature is not none and
                            states(zone.temperature) not in ['unknown', 'unavailable', 'none'] %}
                        {{ states(zone.temperature) | float(0) }}
                      {% else %}
                        none
                      {% endif %}

                    humidity_value: >
                      {% if zone.humidity is not none and
                            states(zone.humidity) not in ['unknown', 'unavailable', 'none'] %}
                        {{ states(zone.humidity) | float(0) }}
                      {% else %}
                        none
                      {% endif %}

                - variables:
                    rain_reduction: >
                      {% if rain < rain_none_below_input | float(0) %}
                        0
                      {% elif rain < rain_low_below_input | float(0) %}
                        {{ rain_low_reduction_input | float(0) }}
                      {% elif rain < rain_medium_below_input | float(0) %}
                        {{ rain_medium_reduction_input | float(0) }}
                      {% elif rain < rain_high_below_input | float(0) %}
                        {{ rain_high_reduction_input | float(0) }}
                      {% else %}
                        100
                      {% endif %}

                    temperature_adjustment: >
                      {% if temperature_value is none %}
                        0
                      {% elif temperature_value < temp_very_cool_input | float(15) %}
                        {{ temp_very_cool_adjustment_input | float(0) }}
                      {% elif temperature_value < temp_cool_input | float(22) %}
                        {{ temp_cool_adjustment_input | float(0) }}
                      {% elif temperature_value >= temp_extreme_input | float(35) %}
                        {{ temp_extreme_adjustment_input | float(0) }}
                      {% elif temperature_value >= temp_hot_input | float(32) %}
                        {{ temp_hot_adjustment_input | float(0) }}
                      {% elif temperature_value >= temp_warm_input | float(28) %}
                        {{ temp_warm_adjustment_input | float(0) }}
                      {% else %}
                        0
                      {% endif %}

                    humidity_adjustment: >
                      {% if humidity_value is none %}
                        0
                      {% elif humidity_value > humidity_high_input | float(80) %}
                        {{ humidity_high_adjustment_input | float(0) }}
                      {% elif humidity_value < humidity_low_input | float(40) %}
                        {{ humidity_low_adjustment_input | float(0) }}
                      {% else %}
                        0
                      {% endif %}

                    seasonal_multiplier: >
                      {% set month = now().month %}
                      {% if month in [12, 1, 2] %}
                        {{ summer_multiplier_input | float(1.15) }}
                      {% elif month in [3, 4, 5] %}
                        {{ autumn_multiplier_input | float(1) }}
                      {% elif month in [6, 7, 8] %}
                        {{ winter_multiplier_input | float(0.70) }}
                      {% else %}
                        {{ spring_multiplier_input | float(1.05) }}
                      {% endif %}

                - variables:
                    effective_rain_reduction: >
                      {% if soil <= zone.critical | float(0) %}
                        {{ [rain_reduction | float(0), critical_rain_reduction_input | float(0)] | min }}
                      {% else %}
                        {{ rain_reduction | float(0) }}
                      {% endif %}

                    final_duration: >
                      {% set d = base_duration | float(0) %}
                      {% set r = effective_rain_reduction | float(0) %}
                      {% set t = temperature_adjustment | float(0) %}
                      {% set h = humidity_adjustment | float(0) %}
                      {% set s = seasonal_multiplier | float(1) %}
                      {{ [zone.min_duration | float(0),
                          [zone.max_duration | float(0),
                           d * (1 - r / 100) * (1 + t / 100) * (1 + h / 100) * s] | min] | max | round(1) }}

                - if:
                    - condition: template
                      value_template: >
                        {{ rain >= rain_high_below_input | float(0)
                           and soil > zone.critical | float(0) }}
                  then:
                    - if:
                        - condition: template
                          value_template: "{{ log_actions_input }}"
                      then:
                        - action: persistent_notification.create
                          data:
                            title: "{{ zone.id }} skipped"
                            message: >
                              Predicted rain is {{ rain | round(1) }} mm. Soil moisture is
                              {{ soil | round(1) }}%, above the critical dryness threshold of
                              {{ zone.critical | round(1) }}%.
                  else:
                    - if:
                        - condition: template
                          value_template: "{{ log_actions_input }}"
                      then:
                        - action: persistent_notification.create
                          data:
                            title: "{{ zone.id }} irrigation started"
                            message: >
                              Soil {{ soil | round(1) }}% / target {{ target | round(1) }}%
                              (deficit {{ deficit | round(1) }}%). Forecast rain
                              {{ rain | round(1) }} mm; rain reduction
                              {{ effective_rain_reduction | round(1) }}%. Temperature adjustment
                              {{ temperature_adjustment | round(1) }}%; humidity adjustment
                              {{ humidity_adjustment | round(1) }}%; seasonal multiplier
                              {{ seasonal_multiplier | round(2) }}. Final duration:
                              {{ final_duration | round(1) }} minutes.

                    - if:
                        - condition: template
                          value_template: "{{ final_duration | float(0) > 0 }}"
                      then:
                        - if:
                            - condition: template
                              value_template: "{{ zone.cycle_enabled }}"
                          then:
                            - variables:
                                remaining_duration: "{{ final_duration | float(0) }}"

                            - repeat:
                                while:
                                  - condition: template
                                    value_template: "{{ remaining_duration | float(0) > 0 }}"
                                sequence:
                                  - variables:
                                      this_cycle: >
                                        {{ [zone.cycle_duration | float(1),
                                            remaining_duration | float(0)] | min }}

                                  - action: homeassistant.turn_on
                                    target:
                                      entity_id: "{{ zone.valve }}"

                                  - delay:
                                      minutes: "{{ this_cycle }}"

                                  - action: homeassistant.turn_off
                                    target:
                                      entity_id: "{{ zone.valve }}"

                                  - variables:
                                      remaining_duration: >
                                        {{ [remaining_duration | float(0) - this_cycle | float(0), 0] | max }}

                                  - if:
                                      - condition: template
                                        value_template: "{{ remaining_duration | float(0) > 0 }}"
                                    then:
                                      - delay:
                                          minutes: "{{ zone.soak_duration }}"
                          else:
                            - action: homeassistant.turn_on
                              target:
                                entity_id: "{{ zone.valve }}"

                            - delay:
                                minutes: "{{ final_duration }}"

                            - action: homeassistant.turn_off
                              target:
                                entity_id: "{{ zone.valve }}"

  - if:
      - condition: template
        value_template: "{{ configured_pump is not none }}"
    then:
      - action: homeassistant.turn_off
        target:
          entity_id: !input pump

  - if:
      - condition: template
        value_template: "{{ water_rate_input | float(0) > 0 and log_actions_input }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Irrigation complete"
          message: >
            Irrigation cycle complete. Configured flow rate is
            {{ water_rate_input | float(0) | round(1) }} L/min.
            V1 logs the calculated duration for each zone; cumulative litre
            accounting will be added in a later revision.

mode: single
max_exceeded: silent
