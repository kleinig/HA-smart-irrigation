        summer_multiplier:
          name: Summer multiplier
          default: 1.15
          selector:
            number:
              min: 0
              max: 3
              step: 0.05
              mode: slider

        autumn_multiplier:
          name: Autumn multiplier
          default: 1
          selector:
            number:
              min: 0
              max: 3
              step: 0.05
              mode: slider

        winter_multiplier:
