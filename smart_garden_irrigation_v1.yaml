              max: 300
              step: 1
              unit_of_measurement: "%"
              mode: slider

        humidity_high:
          name: High humidity threshold
          default: 80
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        humidity_low:
