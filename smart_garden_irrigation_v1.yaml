blueprint:
  name: Smart Garden Irrigation V1
  description: >
    Four-zone, soil-moisture-driven irrigation for Home Assistant. Watering
    duration is calculated from moisture deficit and then compensated for
    predicted rain, soil temperature, soil humidity, and Australian seasons.
    Includes optional pump/tank protection, cycle-and-soak, configurable
    start times, critical-dryness rain override, water-use estimation, and
    detailed persistent logging.
  domain: automation
  source_url: https://www.home-assistant.io/docs/blueprint/
  input:

    global_settings:
      name: Global settings
      icon: mdi:watering-can
      input:

        start_mode:
          name: Start mode
          default: fixed
          selector:
            select:
              options:
                - label: Fixed time
                  value: fixed
                - label: Sunrise
                  value: sunrise
                - label: Sunset
                  value: sunset
                - label: Night (02:00)
                  value: night

        fixed_start:
          name: Fixed start time
          default: "06:00:00"
          selector:
            time: {}

        sun_offset:
          name: Sunrise/sunset offset
          description: Positive values are later; negative values are earlier.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              step: 1
              unit_of_measurement: min
              mode: slider

        minimum_interval:
          name: Minimum interval between scheduled cycles
          description: >
            Prevents a scheduled irrigation cycle from starting again too soon.
            Set to 0 to disable this check.
          default: 24
          selector:
            number:
              min: 0
              max: 168
              step: 1
              unit_of_measurement: h
              mode: slider

        log_actions:
          name: Persistent irrigation logging
          description: Create a persistent notification explaining watering decisions.
          default: true
          selector:
            boolean: {}

    rain_settings:
      name: Rain settings
      icon: mdi:weather-rainy
      input:

        rain_forecast:
          name: Daily predicted rain sensor
          description: >
            Numeric sensor containing the predicted rainfall for the day in mm.
          default: null
          selector:
            entity:
              filter:
                - domain: sensor

        rain_none_below:
          name: No rain compensation below
          default: 2
          selector:
            number:
              min: 0
              max: 50
              step: 0.5
              unit_of_measurement: mm
              mode: slider

        rain_low_below:
          name: Low rain threshold
          default: 5
          selector:
            number:
              min: 0
              max: 100
              step: 0.5
              unit_of_measurement: mm
              mode: slider

        rain_medium_below:
          name: Medium rain threshold
          default: 10
          selector:
            number:
              min: 0
              max: 100
              step: 0.5
              unit_of_measurement: mm
              mode: slider

        rain_high_below:
          name: High rain threshold
          default: 20
          selector:
            number:
              min: 0
              max: 150
              step: 0.5
              unit_of_measurement: mm
              mode: slider

        rain_low_reduction:
          name: Low-rain duration reduction
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        rain_medium_reduction:
          name: Medium-rain duration reduction
          default: 35
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        rain_high_reduction:
          name: High-rain duration reduction
          default: 65
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        critical_rain_reduction:
          name: Maximum rain reduction when critically dry
          description: >
            A critically dry zone is never completely skipped because of
            forecast rain. Instead this is the maximum rain reduction applied.
          default: 50
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    climate_settings:
      name: Temperature, humidity and seasonal compensation
      icon: mdi:thermometer-water
      input:

        temp_very_cool:
          name: Very cool threshold
          default: 15
          selector:
            number:
              min: -10
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        temp_cool:
          name: Cool threshold
          default: 22
          selector:
            number:
              min: -10
              max: 45
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        temp_warm:
          name: Warm threshold
          default: 28
          selector:
            number:
              min: 0
              max: 50
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        temp_hot:
          name: Hot threshold
          default: 32
          selector:
            number:
              min: 0
              max: 55
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        temp_extreme:
          name: Extreme threshold
          default: 35
          selector:
            number:
              min: 0
              max: 60
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        temp_very_cool_adjustment:
